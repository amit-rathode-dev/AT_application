<div class="container-fluid custom-wrapper">
    <div class="card">
        <div class="card-body">

            <div class="row mb-4">
                <div class="col-md-6  mb-3 mb-md-0">
                    <div class="search-container">
                        <input type="text" class="form-control custm-search search-input"
                            placeholder="Search Finance Org..." (input)="applyFilterGlobal($event, 'contains')">
                        <i class="fas fa-search search-icon"></i>
                    </div>
                </div>
                <div class="col-md-6 text-end">
                    <button class="btn btn-success btn-sm" type="button" (click)="createNew()"><span
                            class="pi pi-plus p-1"></span> Create New</button>
                </div>
            </div>



            <p-table #dt [value]="financeOrgData" [paginator]="true" [rows]="10" [rowsPerPageOptions]="[7, 10, 20, 50]"
                [globalFilterFields]="['name']"
                currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries" [rowHover]="true"
                dataKey="id" styleClass="p-datatable-responsive-demo" responsiveLayout="scroll" [scrollable]="true">

                <ng-template pTemplate="header">
                    <tr class="user-table-header">
                        <th pSortableColumn="srno">Sr.No </th>
                                 <th pSortableColumn="name">Branch </th>
                        <th pSortableColumn="name">Region </th>
                        <th pSortableColumn="name">Zone</th>
                        <th pSortableColumn="name">Finance Org </th>
                        <th>Action</th>
                    </tr>
                </ng-template>


                <ng-template pTemplate="body" let-item let-i="rowIndex">
                    <tr>
                        <td>{{ i + 1 }}</td>
                         <td>{{ item.name || 'NA' }}</td>
                        <td>{{ item.name || 'NA' }}</td>
                        <td>{{ item.name || 'NA' }}</td>
                        <td>{{ item.name || 'NA' }}</td>
                        <td>
                            <div class="action-buttons">

                                <a (click)="deleteRole(item)"> <img src="/assets/trash-icon.svg" class="iconimg2"> </a>

                            </div>
                        </td>
                    </tr>
                </ng-template>
            </p-table>
        </div>
    </div>
</div>

<p-dialog [(visible)]="visible" [modal]="true" [draggable]="true" [resizable]="true"
    [style]="{width: '100%', maxWidth: '600px'}" [contentStyle]="{padding: '0'}" styleClass="register-popup"
    [showHeader]="false" [closeOnEscape]="true" [dismissableMask]="true" (onHide)="closeDialog()"
    class="custom-border-popup">

    <div class="role-popup-container">
        <div class="popup-header d-flex justify-content-between align-items-center">
            <div class="logo-container">
                <img src="assets/Kirloskar-Powergen.svg" alt="Kirloskar" height="30">
            </div>
            <h4 class="mb-3 custom-color-h4">Creat Finance Branch</h4>
            <button type="button" aria-label="Close" (click)="closeDialog()" class="close-btn">×</button>
        </div>

        <div class="popup-body p-3">
            <div class=" d-flex justify-content-center w-100 mb-5">
            </div>



            <form [formGroup]="financeOrgForm" (ngSubmit)="submitForm()">




                <div class="mb-2 px-3">
                    <label class="form-label">Finance Org</label>
                    <select class="form-select form-select-sm custom-input custom-placeholder"
                        formControlName="selectedOrg">
                        <option [ngValue]="null" disabled selected>--Select--</option>
                        <option *ngFor="let zone of financeOrg" [value]="zone.id">{{ zone.name }}</option>
                    </select>
                    <div class="text-danger small" style="min-height: 18px;">
                        <span
                            *ngIf="financeOrgForm.get('selectedOrg')?.invalid && financeOrgForm.get('selectedOrg')?.touched">
                            Org
                            is
                            required</span>
                    </div>
                </div>

          

                <div class="mb-2 px-3">
                    <label class="form-label">Region<span class="text-danger">*</span></label>
                    <select class="form-select form-select-sm custom-input custom-placeholder"
                        formControlName="selectedZone">
                        <option [ngValue]="null" disabled selected>--Select--</option>
                        <option *ngFor="let zone of zoneData" [value]="zone.id">{{ zone.name }}</option>
                    </select>
                    <div class="text-danger small" style="min-height: 18px;">
                        <span
                            *ngIf="financeOrgForm.get('selectedZone')?.invalid && financeOrgForm.get('selectedZone')?.touched">Zone
                            is
                            required</span>
                    </div>
                </div>


                      <div class="mb-2 px-3">
                    <label for="name" class="form-label">Branch <span class="text-danger">*</span></label>
                    <input type="text" class="form-control form-control-sm custom-input custom-placeholder"
                        placeholder="Enter Finance org" formControlName="name" />
                    <small class="text-danger"
                        *ngIf="financeOrgForm.get('name')?.invalid && !financeOrgForm.get('name')?.errors?.['roleExists'] && financeOrgForm.get('name')?.touched">
                        Role is required
                    </small>
                </div>



                <div class="d-flex justify-content-center mt-4">
                    <button type="submit" class="btn btn-success custom-btn btn-width update-button">Submit</button>
                </div>

            </form>

        </div>
    </div>

</p-dialog>
